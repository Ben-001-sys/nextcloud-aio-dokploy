# Example only: mount to Dokploy Traefik's actual dynamic config directory
# after replacing both hostnames and HOST_IP_REACHABLE_FROM_TRAEFIK.
# AIO Apache runs on TWO DIFFERENT ROOTLESS DOCKER ENGINES, not dokploy-network.
# Do not install unmodified. Never duplicate an existing Traefik router name.
http:
  routers:
    aio-ben-http:
      rule: "Host(`aio-ben.example.com`)"
      entryPoints: [web]
      middlewares: [aio-https-redirect]
      service: aio-ben-service
    aio-ben-https:
      rule: "Host(`aio-ben.example.com`)"
      entryPoints: [websecure]
      service: aio-ben-service
      middlewares: [aio-hsts]
      tls:
        certResolver: letsencrypt
    aio-colleague-http:
      rule: "Host(`aio-colleague.example.com`)"
      entryPoints: [web]
      middlewares: [aio-https-redirect]
      service: aio-colleague-service
    aio-colleague-https:
      rule: "Host(`aio-colleague.example.com`)"
      entryPoints: [websecure]
      service: aio-colleague-service
      middlewares: [aio-hsts]
      tls:
        certResolver: letsencrypt
  services:
    aio-ben-service:
      loadBalancer:
        servers:
          - url: "http://HOST_IP_REACHABLE_FROM_TRAEFIK:11000"
    aio-colleague-service:
      loadBalancer:
        servers:
          - url: "http://HOST_IP_REACHABLE_FROM_TRAEFIK:11001"
  middlewares:
    aio-https-redirect:
      redirectScheme:
        scheme: https
    aio-hsts:
      headers:
        stsSeconds: 15552000
        stsIncludeSubdomains: false
        stsPreload: false
        customRequestHeaders:
          X-Forwarded-Proto: https
