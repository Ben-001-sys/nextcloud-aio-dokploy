# Nextcloud All-in-One behind the existing Dokploy/Traefik reverse proxy.
# AIO manages its own sibling containers through the Docker API.
# WARNING: This is for a separate experiment and does not replace the existing Nextcloud.
# See README.md for required DNS, reverse proxy, and host safety checks.
name: nextcloud-aio

services:
  nextcloud-aio-mastercontainer:
    image: ghcr.io/nextcloud-releases/all-in-one:latest
    container_name: nextcloud-aio-mastercontainer
    init: true
    restart: always
    network_mode: bridge
    ports:
      # Access only through a trusted SSH tunnel.
      - "127.0.0.1:8080:8080"
    environment:
      APACHE_PORT: "11000"
      # Required when Traefik connects over dokploy-network rather than localhost.
      # WARNING: Restrict public access to TCP 11000 at the upstream firewall.
      APACHE_IP_BINDING: "0.0.0.0"
      APACHE_ADDITIONAL_NETWORK: "dokploy-network"
      SKIP_DOMAIN_VALIDATION: "false"
      TALK_PORT: "${AIO_TALK_PORT:-3479}"
    volumes:
      - nextcloud_aio_mastercontainer:/mnt/docker-aio-config
      # AIO requires highly privileged access to manage Docker containers.
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  nextcloud_aio_mastercontainer:
    name: nextcloud_aio_mastercontainer
