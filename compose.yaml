# Use this file separately with TWO INDEPENDENT ROOTLESS DOCKER ENGINES.
# DO NOT deploy with Dokploy's system/rootful Docker engine.
# Each account has its own rootless Docker daemon and own .env file.
name: nextcloud-aio

services:
  nextcloud-aio-mastercontainer:
    image: ghcr.io/nextcloud-releases/all-in-one:latest
    container_name: nextcloud-aio-mastercontainer
    init: true
    restart: always
    ports:
      # Rootless-engine management UI; access using an SSH tunnel only.
      - "127.0.0.1:${AIO_ADMIN_PORT:?Set_AIO_ADMIN_PORT}:8080"
    environment:
      # Unique host port per rootless instance for the AIO Apache container.
      APACHE_PORT: "${AIO_APACHE_PORT:?Set_AIO_APACHE_PORT}"
      # Reverse proxy in system Docker connects through a host-reachable IP.
      # Block unsolicited public inbound traffic to the Apache ports.
      APACHE_IP_BINDING: "0.0.0.0"
      TALK_PORT: "${AIO_TALK_PORT:?Set_AIO_TALK_PORT}"
      # Required by AIO when its Docker daemon/socket is rootless.
      WATCHTOWER_DOCKER_SOCKET_PATH: "${XDG_RUNTIME_DIR:?Login_as_rootless_user}/docker.sock"
    volumes:
      - nextcloud_aio_mastercontainer:/mnt/docker-aio-config
      # This is the CURRENT USER's rootless daemon, NEVER /var/run/docker.sock.
      - "${XDG_RUNTIME_DIR:?Login_as_rootless_user}/docker.sock:/var/run/docker.sock:ro"

volumes:
  nextcloud_aio_mastercontainer:
    name: nextcloud_aio_mastercontainer
